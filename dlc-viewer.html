<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLC File Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #00ff00;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 20px;
        }
        input[type="file"] {
            margin-bottom: 20px;
        }
        pre {
            background-color: #2e2e2e;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            overflow-x: auto;
        }
        .file-details {
            margin-top: 20px;
        }
        .file-details div {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>DLC File Viewer</h1>
    <input type="file" id="fileInput" accept=".dlc">
    <pre id="fileContent">Please select a .dlc file to view its contents.</pre>
    <div class="file-details" id="fileDetails"></div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    document.getElementById('fileContent').textContent = content;
                    displayFileDetails(file);
                };
                reader.readAsText(file);
            }
        });

        function displayFileDetails(file) {
            const fileDetailsDiv = document.getElementById('fileDetails');
            fileDetailsDiv.innerHTML = `
                <div><strong>File Name:</strong> ${file.name}</div>
                <div><strong>File Size:</strong> ${file.size} bytes</div>
                <div><strong>Last Modified:</strong> ${file.lastModifiedDate}</div>
            `;
        }
    </script>
</body>
</html>
