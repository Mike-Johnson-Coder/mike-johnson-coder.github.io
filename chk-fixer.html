<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHK File Examiner</title>
</head>
<body>
    <h1>CHK File Examiner</h1>
    <input type="file" id="fileInput" accept=".chk" multiple>
    <button onclick="examineFiles()">Examine Files</button>
    <div id="results"></div>

    <script>
        function examineFiles() {
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            if (files.length === 0) {
                alert('Please select .chk files to examine.');
                return;
            }

            for (const file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const arrayBuffer = e.target.result;
                    const uint8Array = new Uint8Array(arrayBuffer);
                    const fileExtension = determineFileExtension(uint8Array);
                    const result = document.createElement('p');
                    result.textContent = `${file.name}: ${fileExtension}`;
                    resultsDiv.appendChild(result);
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function determineFileExtension(uint8Array) {
            // Mapping of file signatures (magic numbers) to file extensions
            const fileSignatures = {
                '25504446': 'pdf',
                'FFD8FFE0': 'jpg',
                'FFD8FFE1': 'jpg',
                'FFD8FFE2': 'jpg',
                '89504E47': 'png',
                '47494638': 'gif',
                '504B0304': 'zip',
                '3C3F786D': 'xml',
                '25215053': 'ps',
                '377ABCAF': '7z',
                '52617221': 'rar',
                '504B34': 'zip',
                '49492A00': 'tif',
                '424D': 'bmp',
                // Add more file signatures and extensions as needed
            };

            // Get the file signature (first 4 bytes)
            const hexSignature = uint8Array.slice(0, 4).reduce((acc, byte) => acc + byte.toString(16).padStart(2, '0').toUpperCase(), '');

            // Check against known file signatures
            for (const [signature, extension] of Object.entries(fileSignatures)) {
                if (hexSignature.startsWith(signature)) {
                    return extension;
                }
            }

            return 'unknown';
        }
    </script>
</body>
</html>
