<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureTestPro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 9999;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="fullscreen-container" class="fullscreen">
        <h1>SecureTestPro</h1>
        <input type="file" id="fileInput" accept=".zip" required><br><br>
        <form id="testForm" class="hidden" onsubmit="return submitTest()">
            <div id="questionsContainer"></div>
            <label for="teacherEmail">Teacher's Email:</label>
            <input type="email" id="teacherEmail" name="teacherEmail" required><br><br>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            document.body.requestFullscreen();
            preventActions();
        });

        function preventActions() {
            document.addEventListener('paste', (event) => {
                event.preventDefault();
                alert('Pasting content is not allowed!');
            });

            window.addEventListener('blur', () => {
                alert('You cannot switch tabs/windows during the test!');
                window.focus();
            });

            document.addEventListener('keydown', (event) => {
                if (event.ctrlKey || event.altKey || event.metaKey) {
                    event.preventDefault();
                    alert('Key combinations are disabled!');
                }
            });
        }

        document.getElementById('fileInput').addEventListener('change', handleFile);

        function handleFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    JSZip.loadAsync(e.target.result).then(function(zip) {
                        zip.file("testQuestions.txt").async("string").then(function(content) {
                            displayQuestions(content);
                        });
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function displayQuestions(content) {
            const questionsContainer = document.getElementById('questionsContainer');
            const questions = content.split('\n');
            questions.forEach((question, index) => {
                const questionLabel = document.createElement('label');
                questionLabel.innerText = `Question ${index + 1}: ${question}`;
                const questionInput = document.createElement('textarea');
                questionInput.id = `question${index + 1}`;
                questionInput.name = `question${index + 1}`;
                questionInput.required = true;
                questionsContainer.appendChild(questionLabel);
                questionsContainer.appendChild(questionInput);
                questionsContainer.appendChild(document.createElement('br'));
                questionsContainer.appendChild(document.createElement('br'));
            });
            document.getElementById('testForm').classList.remove('hidden');
        }

        async function submitTest() {
            const teacherEmail = document.getElementById('teacherEmail').value;
            const questionsContainer = document.getElementById('questionsContainer');
            const answers = Array.from(questionsContainer.querySelectorAll('textarea')).map((textarea, index) => {
                return `Question ${index + 1} Answer: ${textarea.value}`;
            }).join('\n');

            const emailBody = `Teacher's Email: ${teacherEmail}\n\n${answers}`;
            
            // Send request to Node.js server hosted on Heroku
            const response = await fetch('https://your-app-name.herokuapp.com/send-email', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    teacherEmail: teacherEmail,
                    emailBody: emailBody
                })
            });

            if (response.ok) {
                alert('Test submitted successfully!');
            } else {
                alert('Failed to submit the test!');
            }

            return false;
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
</body>
</html>
