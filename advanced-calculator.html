<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .calculator {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        #display {
            width: 100%;
            height: 40px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 10px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        button {
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .utility-buttons {
            grid-column: span 5;
        }

        .variables {
            grid-column: span 3;
        }

        .nav-links {
            margin-top: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #007bff;
            font-size: 18px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" disabled>
        <div class="buttons">
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('/')">/</button>
            <button onclick="appendToDisplay('sqrt(')">√</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('*')">*</button>
            <button onclick="appendToDisplay('^')">^</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('-')">-</button>
            <button onclick="appendToDisplay('x')">x</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="calculateResult()">=</button>
            <button onclick="appendToDisplay('+')">+</button>
            <button onclick="appendToDisplay('y')">y</button>
            <button onclick="appendToDisplay('z')">z</button>
            <button class="small-button" onclick="clearDisplay()">C</button>
            <button class="utility-buttons" onclick="backspace()">Backspace</button>
        </div>
    </div>
    <div class="nav-links">
        <a href="simulator.html">Go to Vending Machine Simulator</a>
    </div>
    <script>
        let variables = { x: 0, y: 0, z: 0 };

        function appendToDisplay(value) {
            document.getElementById('display').value += value;
        }

        function clearDisplay() {
            document.getElementById('display').value = '';
        }

        function backspace() {
            const display = document.getElementById('display');
            display.value = display.value.slice(0, -1);
        }

        function calculateResult() {
            const display = document.getElementById('display');
            let expression = display.value;

            // Replace variables with their values
            expression = expression.replace(/x/g, variables.x);
            expression = expression.replace(/y/g, variables.y);
            expression = expression.replace(/z/g, variables.z);

            // Replace power operator
            expression = expression.replace(/\^/g, '**');

            // Handle square root function
            expression = expression.replace(/sqrt\(/g, 'Math.sqrt(');

            try {
                display.value = eval(expression);
            } catch (error) {
                display.value = 'Error';
            }
        }

        function setVariable(variable, value) {
            variables[variable] = value;
        }

        // Example setup for setting variable values
        // In a real application, you might want to provide an interface for users to set these values
        setVariable('x', 5);
        setVariable('y', 3);
        setVariable('z', 2);
    </script>
</body>
</html>
