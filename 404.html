<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
        }

        h1 {
            font-size: 3em;
            margin: 0;
        }

        p {
            font-size: 1.2em;
            margin: 10px 0;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .button.home {
            background-color: green;
        }

        .button.home:hover {
            background-color: darkgreen;
        }

        .button.documentation {
            background-color: gray;
        }

        .button.documentation:hover {
            background-color: darkgray;
        }

        .container {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./404.png"></img>
        <h1>404</h1>
        <p>Oops! The page you are looking for does not exist.</p>
        <p>It might have been removed, or the URL might be incorrect.</p>
        <a href="https://mike-johnson-coder.github.io/" class="button home">Go back to Home</a>
        <a href="https://docs.github.com/en/pages" target="_blank" class="button documentation">GitHub Pages documentation</a>
    </div>
</body>
</html>
