<!DOCTYPE html>
<html>
<head>
    <title>Urban Planning Simulation</title>
    <style>
        .land-parcel {
            display: inline-block;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ddd;
            cursor: pointer;
        }
        #select-all-container {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Urban Planning Simulation</h1>
    <div id="select-all-container">
        <input type="checkbox" id="select-all"> Select All
    </div>
    <div id="land-container">
        <div class="land-parcel"><input type="checkbox" class="land-checkbox"> Parcel 1</div>
        <div class="land-parcel"><input type="checkbox" class="land-checkbox"> Parcel 2</div>
        <div class="land-parcel"><input type="checkbox" class="land-checkbox"> Parcel 3</div>
        <div class="land-parcel"><input type="checkbox" class="land-checkbox"> Parcel 4</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const selectAllCheckbox = document.getElementById('select-all');
            const landCheckboxes = document.querySelectorAll('.land-checkbox');
        
            selectAllCheckbox.addEventListener('change', function() {
                landCheckboxes.forEach(checkbox => {
                    checkbox.checked = selectAllCheckbox.checked;
                });
            });
        
            landCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    if (!checkbox.checked) {
                        selectAllCheckbox.checked = false;
                    } else if (Array.from(landCheckboxes).every(cb => cb.checked)) {
                        selectAllCheckbox.checked = true;
                    }
                });
            });
        });
    </script>
</body>
</html>
